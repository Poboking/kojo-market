name: publish
run-name: publish ${{ github.ref_name }} @${{ github.sha }}

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# 部署路（b 系）：发布源永远是 legacy 分支 gh-pages —— 不改 build_type、不改 source、不建 Pages。
# contents:write = 推 gh-pages；pages:write 只干一件事：POST /pages/builds 请求一次构建。
#   官方文档明确「由 GITHUB_TOKEN 推送的提交不会触发 GitHub Pages 生成」
#   （docs.github.com/pages/getting-started-with-github-pages/configuring-a-publishing-source-for-your-github-pages-site）
#   ⇒ branch push 之后必须显式请求构建，否则站点永远停在旧内容。这条 API 省不掉。
# 不用 configure-pages/upload-pages-artifact/deploy-pages ⇒ 不需要 id-token:write，
# 也永不把 build_type 翻成 workflow（翻了之后 POST /pages/builds 永拒，不可回退）。
permissions:
  contents: write
  pages: write

concurrency:
  group: registry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: 合规校验（结构 / 字段 / 逐文件 sha256 重算）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PR 补全明文树（R2 待审 zip -> hydrate -> 推回 PR 分支）
        if: github.event_name == 'pull_request'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          # 仅 publish/<id>-<version> 分支（Worker 开的 PR）才可能缺 files/；
          # 分支不匹配 / files/ 已在（幂等重跑、人工 PR）-> 跳过补全，validate 原样跑
          case "$GITHUB_HEAD_REF" in
            publish/*-*) ;;
            *) echo "分支 $GITHUB_HEAD_REF 非 publish/<id>-<version>，跳过补全"; exit 0;;
          esac
          sel="${GITHUB_HEAD_REF#publish/}"
          id="${sel%-*}"; version="${sel##*-}"
          packdir="$(ls -d packs/*/"$id"/"$version" 2>/dev/null | head -1 || true)"
          [ -n "$packdir" ] || { echo "树内找不到 packs/*/$id/$version，跳过补全"; exit 0; }
          if [ -d "$packdir/files" ]; then echo "files/ 已在 -> 幂等重跑 / 人工 PR，跳过补全"; exit 0; fi
          [ -n "$R2_ACCOUNT_ID" ] || { echo "FAIL R2_ACCOUNT_ID 未配置（secrets 待补）"; exit 1; }
          endpoint="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          prefix="pending/$id-$version-"
          listing="$(aws s3api list-objects-v2 --endpoint-url "$endpoint" --bucket kojo-market --prefix "$prefix" --output json)"
          zipkey="$(printf '%s' "$listing" | jq -r '[.Contents[]?.Key] | map(select(endswith(".zip"))) | sort | last // empty')"
          [ -n "$zipkey" ] || { echo "FAIL R2 待审区找不到 $prefix*.zip"; exit 1; }
          jsonkey="${zipkey%.zip}.json"
          mkdir -p dist/hydrate
          aws s3api get-object --endpoint-url "$endpoint" --bucket kojo-market --key "$zipkey" dist/hydrate/pending.zip > /dev/null
          aws s3api get-object --endpoint-url "$endpoint" --bucket kojo-market --key "$jsonkey" dist/hydrate/pending.json > /dev/null
          # 容器完整性接力闸：R2 meta 的 report.containerSha256 == 实际下载字节
          actual="$(sha256sum dist/hydrate/pending.zip | cut -d' ' -f1)"
          declared="$(jq -r '.report.containerSha256' dist/hydrate/pending.json)"
          [ "$actual" = "$declared" ] || { echo "FAIL 容器 sha256 对拍不符：meta $declared / 实际 $actual"; exit 1; }
          mid="$(jq -r '.manifest.id' dist/hydrate/pending.json)"
          mver="$(jq -r '.manifest.version' dist/hydrate/pending.json)"
          [ "$mid" = "$id" ] && [ "$mver" = "$version" ] || { echo "FAIL meta manifest $mid@$mver 与分支 $GITHUB_HEAD_REF 不符"; exit 1; }
          rel="$(jq -r '.manifest.kind' dist/hydrate/pending.json)/$id/$version"
          # hydrate 在 merge-ref 检出树上跑：worker 开的分支基于旧 master，head 的 scripts/market.mjs
          # 可能还没有 hydrate 命令
          node scripts/market.mjs hydrate packs "$rel" dist/hydrate/pending.zip
          # 补全 commit 用 plumbing 直接组在真实 PR head 上——不切分支（checkout@v4 检的是
          # refs/pull/N/merge，直接推会推回 merge commit；且 runner 上 status 扫描对新写出的
          # 未跟踪文件不可靠）。GITHUB_TOKEN 推的提交不触发新 run，天然防循环。
          git fetch origin "+refs/heads/$GITHUB_HEAD_REF:refs/remotes/origin/pr-head"
          xidx="$(mktemp -u)"
          GIT_INDEX_FILE="$xidx" git read-tree refs/remotes/origin/pr-head
          GIT_INDEX_FILE="$xidx" git add "$rel/files"
          if GIT_INDEX_FILE="$xidx" git diff --cached --quiet refs/remotes/origin/pr-head -- "$rel/files"; then
            echo "补全后无新内容"
            rm -f "$xidx"
            exit 0
          fi
          tree="$(GIT_INDEX_FILE="$xidx" git write-tree)"
          rm -f "$xidx"
          commit="$(git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit-tree "$tree" -p refs/remotes/origin/pr-head \
            -m "ci(hydrate): 从 R2 待审 zip 补全 $rel 明文树（容器与逐文件 sha256 对账通过）")"
          git push origin "$commit:refs/heads/$GITHUB_HEAD_REF"
          echo "已推补全 commit $commit 回 $GITHUB_HEAD_REF"

      - name: validate
        run: node scripts/market.mjs validate packs

  publish:
    name: 发布 zip 资产 + 生成 index.json + 推 gh-pages
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      PAGES_URL: https://poboking.github.io/kojo-market
    steps:
      - uses: actions/checkout@v4
        with:
          # 全历史：generatedAt 要锚在「最后一个能改变索引内容的提交」上，不是 HEAD
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: validate（重算一次，防发布 job 与校验 job 看到不同内容）
        run: node scripts/market.mjs validate packs

      - name: 内容锚点（索引里 generatedAt 的唯一时间源）
        id: anchor
        run: |
          set -euo pipefail
          # packs/**（内容）+ scripts/**（出索引的代码）+ .gitattributes（决定 checkout 字节）
          # 之外的提交（含改本 workflow、README）不得改变索引字节 —— 这样重复 run 才可能零副作用
          A="$(git log -1 --format=%cI "$GITHUB_SHA" -- packs scripts .gitattributes)"
          [ -n "$A" ] || A="$(git show -s --format=%cI "$GITHUB_SHA")"
          echo "锚点 = 最后一个内容/工具链提交的 commit date: $A"
          {
            echo "date=$A"
            echo "iso=$(node -e 'const d=new Date(process.argv[1]);if(Number.isNaN(d.getTime()))process.exit(1);process.stdout.write(d.toISOString())' "$A")"
          } >> "$GITHUB_OUTPUT"

      - name: 逐包版本发布 / 复用 zip 资产（同 tag 已存在则不覆盖）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/assets dist/published dist/facts dist/pages
          : > dist/facts/facts.jsonl
          node scripts/market.mjs plan packs > dist/plan.tsv
          wc -l < dist/plan.tsv | xargs -I{} echo "计划发布 {} 个包版本"
          while IFS=$'\t' read -r kind id version rel tag asset; do
            z="dist/assets/$asset"          # 本地确定性重算（zip 时间戳钉死 1980-01-01，不看 mtime）
            p="dist/published/$asset"       # 远端真实资产（匿名下载，客户端就是这么拉的）
            node scripts/market.mjs zip packs "$rel" "$z" >/dev/null
            ref="https://api.github.com/repos/$GH_REPO/git/ref/tags/$tag"
            if gh api "$ref" >/dev/null 2>&1; then
              echo "tag $tag 已存在 -> 复用不可变资产（不建 release、不传资产、不动 tag）"
            else
              echo "tag $tag 不存在 -> 新建 release + 上传资产（--target 本次 commit）"
              gh release create "$tag" "$z" \
                --target "$GITHUB_SHA" \
                --title "$id v$version" \
                --notes "$kind \`$id\` \`$version\` —— 由 CI 自动发布。zip 根部 = pack.json + files/**，明文在 \`packs/$rel/\`。" \
                --latest=false
            fi
            url="$(gh api "repos/$GH_REPO/releases/tags/$tag" --jq ".assets[] | select(.name == \"$asset\") | .browser_download_url")"
            [ -n "$url" ] || { echo "FAIL release $tag 查不到资产 $asset（release 被删过 / 资产被换名，请人工处理）"; exit 1; }
            curl --fail --silent --show-error --location --output "$p" "$url" \
              || { echo "FAIL 匿名下载失败 $url"; exit 1; }
            # 不可变硬闸：远端资产必须与本地按同一规则重算的 zip 逐字节全等
            cmp "$p" "$z" \
              || { echo "FAIL $asset 远端资产 != 本地重算 zip：已发布内容被改动 / 上传被截断"; exit 1; }
            echo "immutable ok: $asset 远端资产 == 本地重算 zip（$(wc -c < "$p") 字节）"
            # 内容类硬闸：资产里的 pack.json + files/** 必须与仓库声明逐字节一致
            node scripts/market.mjs verify packs "$rel" "$p" > "dist/facts/line.tsv"
            printf '{"kind":"%s","id":"%s","version":"%s","url":"%s","sha256":"%s","bytes":%s}\n' \
              "$kind" "$id" "$version" "$url" "$(cut -f2 dist/facts/line.tsv)" "$(cut -f1 dist/facts/line.tsv)" \
              >> dist/facts/facts.jsonl
          done < dist/plan.tsv
          cat dist/facts/facts.jsonl

      - name: 生成 index.json + deploy.json（三条断言任一红 => run 红）
        env:
          ANCHOR: ${{ steps.anchor.outputs.date }}
          ISO: ${{ steps.anchor.outputs.iso }}
        run: |
          set -euo pipefail
          [ -n "$ANCHOR" ] && [ -n "$ISO" ] || { echo "FAIL 内容锚点为空"; exit 1; }
          node scripts/market.mjs index packs dist/facts/facts.jsonl dist/pages/index.json --commit-date "$ANCHOR"
          node scripts/market.mjs index packs dist/facts/facts.jsonl dist/pages/rerun.json  --commit-date "$ANCHOR"
          sort -r dist/facts/facts.jsonl > dist/facts/facts.rev.jsonl
          node scripts/market.mjs index packs dist/facts/facts.rev.jsonl dist/pages/rev.json --commit-date "$ANCHOR"
          cmp dist/pages/index.json dist/pages/rerun.json || { echo "FAIL 断言1：同输入重跑 index.json 字节不同"; exit 1; }
          cmp dist/pages/index.json dist/pages/rev.json  || { echo "FAIL 断言2：index.json 受事实输入顺序影响"; exit 1; }
          grep -qF "\"generatedAt\": \"$ISO\"" dist/pages/index.json \
            || { echo "FAIL 断言3：generatedAt 没有锚在内容提交（$ISO）上，字节稳定判据不成立"; exit 1; }
          echo "断言 1/2/3 全绿（重跑全等 / 乱序全等 / 时间戳锚定）"
          rm dist/pages/rerun.json dist/pages/rev.json dist/facts/facts.rev.jsonl
          # deploy.json = 部署见证：内容只由 index.json 决定（无 run id / 无 HEAD sha）=> 同索引重复 run 必为 no-op
          H="$(sha256sum dist/pages/index.json | cut -d' ' -f1)"
          B="$(wc -c < dist/pages/index.json | tr -d ' ')"
          printf '{"schema":1,"engine":"github-pages-legacy:gh-pages","anchor":"%s","indexBytes":%s,"indexSha256":"%s"}\n' \
            "$ISO" "$B" "$H" > dist/pages/deploy.json
          sha256sum dist/pages/index.json dist/pages/deploy.json

      - name: 推 gh-pages（内容相同 => 零提交零 API；真推了才请求 Pages 构建）
        id: deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/gh-pages:refs/remotes/origin/gh-pages"
          base=origin/gh-pages
          git rev-parse -q --verify "$base" >/dev/null || { echo "FAIL gh-pages 分支不存在（Pages legacy 源要求它在位）"; exit 1; }
          ih="$(git hash-object -w dist/pages/index.json)"
          dh="$(git hash-object -w dist/pages/deploy.json)"
          ci="$(git rev-parse -q --verify "$base:index.json" || echo none)"
          cd_="$(git rev-parse -q --verify "$base:deploy.json" || echo none)"
          if [ "$ih" = "$ci" ] && [ "$dh" = "$cd_" ]; then
            echo "幂等：gh-pages 上的 index.json / deploy.json 与本次产物 blob 全等 -> 不提交、不推送、不碰 Pages API"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "待写 blob: index.json=$ih（远端现为 $ci） deploy.json=$dh（远端现为 $cd_）"
          # 只用 plumbing 组一个 commit，绝不碰 master 工作树
          xidx="$(mktemp -u)"
          GIT_INDEX_FILE="$xidx" git read-tree "$base"
          GIT_INDEX_FILE="$xidx" git update-index --add --cacheinfo "100644,$ih,index.json" --cacheinfo "100644,$dh,deploy.json"
          tree="$(GIT_INDEX_FILE="$xidx" git write-tree)"
          rm -f "$xidx"
          commit="$(git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit-tree "$tree" -p "$base" \
            -m "deploy(gh-pages): index.json @ master $(git log -1 --format=%h "$GITHUB_SHA")（CI 生成，字节稳定）")"
          git push origin "$commit:refs/heads/gh-pages"
          echo "已推 gh-pages commit=$commit"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          # build_type 必须是 legacy：被翻成 workflow 之后 POST /pages/builds 永拒，且这条路回不去
          bt="$(gh api "repos/$GH_REPO/pages" --jq .build_type || echo unreachable)"
          echo "当前 Pages build_type=$bt"
          [ "$bt" = legacy ] || { echo "FAIL Pages build_type=$bt（期望 legacy）：发布源被改过，请人工定夺，CI 不自动翻源"; exit 1; }
          # GITHUB_TOKEN 推的提交不触发 Pages 构建（官方文档）=> 显式请求一次，只请求，不改配置
          gh api -X POST "repos/$GH_REPO/pages/builds" --silent >/dev/null
          echo "已 POST /pages/builds 请求构建"

      - name: 匿名读回判据（站点字节 == 本次 CI 产物字节）
        env:
          PUSHED: ${{ steps.deploy.outputs.pushed }}
        run: |
          set -euo pipefail
          mkdir -p dist/readback
          # 没推过东西 => 站点本来就该是最新，一次判；推过 => 等 Pages 构建（CDN max-age=600，给到 ~7min）
          tries=1
          if [ "$PUSHED" = true ]; then tries=28; fi
          for f in index.json deploy.json; do
            hit=no
            i=1
            while [ "$i" -le "$tries" ]; do
              code="$(curl --noproxy '*' --silent --show-error --location \
                --output "dist/readback/$f" --write-out '%{http_code}' "$PAGES_URL/$f" || echo 000)"
              if [ "$code" = 200 ] && cmp -s "dist/readback/$f" "dist/pages/$f"; then hit=yes; break; fi
              i=$((i + 1)); sleep 15
            done
            [ "$hit" = yes ] || { echo "FAIL $f 读回不合格：http=$code 且/或与 CI 产物字节不同（tries=$tries）"; exit 1; }
            printf '%s 匿名读回 http=%s bytes=%s sha256=%s\n' "$f" "$code" \
              "$(wc -c < "dist/readback/$f" | tr -d ' ')" "$(sha256sum < "dist/readback/$f" | cut -d' ' -f1)"
          done
